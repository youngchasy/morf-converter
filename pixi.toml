[workspace]
name = "morf-engine-pack"
version = "0.1.0"
description = "Offline command-line engines bundled with Morf"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
"7zip" = ">=24,<27"
exiftool = ">=13,<14"
ffmpeg = ">=7,<9"
pandoc = ">=3,<4"
poppler = ">=24,<27"
qpdf = ">=11,<13"
tesseract = ">=5.4,<6"

