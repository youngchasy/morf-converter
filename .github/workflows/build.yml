name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run fixtures
      - run: npm test
      - run: npm run build

  engine-smoke:
    name: Real file smoke tests
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install desktop and conversion engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils \
            ffmpeg qpdf poppler-utils pandoc libreoffice tesseract-ocr \
            tesseract-ocr-eng tesseract-ocr-rus \
            libimage-exiftool-perl p7zip-full zip
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm run fixtures
      - name: Test Rust core with real fixtures
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

  desktop:
    name: ${{ matrix.name }}
    needs: [frontend, engine-smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            target: ""
            pixi_platform: linux-64
            pixi_unpack_asset: pixi-unpack-x86_64-unknown-linux-musl
            pixi_unpack_file: pixi-unpack
            args: --bundles appimage,deb,rpm
            bundle_path: src-tauri/target/release/bundle/**/*
          - name: Windows x64
            runner: windows-latest
            target: ""
            pixi_platform: win-64
            pixi_unpack_asset: pixi-unpack-x86_64-pc-windows-msvc.exe
            pixi_unpack_file: pixi-unpack.exe
            args: --bundles nsis
            bundle_path: src-tauri/target/release/bundle/**/*
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            pixi_platform: osx-64
            pixi_unpack_asset: pixi-unpack-x86_64-apple-darwin
            pixi_unpack_file: pixi-unpack
            args: --target x86_64-apple-darwin --bundles dmg
            bundle_path: src-tauri/target/x86_64-apple-darwin/release/bundle/**/*
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            pixi_platform: osx-arm64
            pixi_unpack_asset: pixi-unpack-aarch64-apple-darwin
            pixi_unpack_file: pixi-unpack
            args: --target aarch64-apple-darwin --bundles dmg
            bundle_path: src-tauri/target/aarch64-apple-darwin/release/bundle/**/*
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - name: Install Linux system dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf xdg-utils rpm libreoffice
      - name: Install LibreOffice on Windows for bundling
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install libreoffice-fresh --yes --no-progress
      - name: Install LibreOffice on macOS for bundling
        if: runner.os == 'macOS'
        shell: bash
        run: brew install --cask libreoffice
      - name: Install Rust toolchain
        if: matrix.target == ''
        uses: dtolnay/rust-toolchain@stable
      - name: Install Rust toolchain and target
        if: matrix.target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm run check:version
      - name: Build offline processing-engine pack
        shell: bash
        run: |
          rm -f environment.tar
          pixi lock
          pixi global install "pixi-pack=0.7.10"
          curl --fail --location --retry 4 --retry-all-errors \
            "https://github.com/Quantco/pixi-pack/releases/download/v0.7.10/${{ matrix.pixi_unpack_asset }}" \
            --output "${{ matrix.pixi_unpack_file }}"
          chmod +x "${{ matrix.pixi_unpack_file }}"
          pixi-pack --platform "${{ matrix.pixi_platform }}" pixi.toml
          npm run engines:stage
        env:
          MORF_ENGINE_PLATFORM: ${{ matrix.pixi_platform }}
          MORF_PIXI_UNPACK: ${{ github.workspace }}/${{ matrix.pixi_unpack_file }}
      - name: Verify every bundled engine
        run: npm run engines:verify
      - name: Enable ad-hoc macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
      - name: Upload installer bundle
        uses: actions/upload-artifact@v7
        with:
          name: Morf-${{ matrix.name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
